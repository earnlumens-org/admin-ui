<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Modern favicon set: a multi-size .ico for Safari / legacy, a
         scalable SVG for Chrome / Firefox / Edge, and a 180×180
         apple-touch-icon for iOS "Add to Home Screen". All are a white
         flame on the brand dark tile so they stay legible on any browser
         chrome (light or dark, desktop or mobile). -->
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#10131A">
    <!-- Baseline security headers. Strict CSP and HSTS are enforced at
         the Cloudflare Pages edge (see DEPLOY.md); these meta tags are
         the in-document fallback for environments that don't honour
         the edge config (local dev, file:// previews). -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>EARNLUMENS Admin Panel</title>
    <meta property="og:image" content="/meta/earnlumens-admin-meta-image-v1.jpg" />
    <meta property="og:image:width" content="1344" />
    <meta property="og:image:height" content="768" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/meta/earnlumens-admin-meta-image-v1.jpg" />
  </head>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
